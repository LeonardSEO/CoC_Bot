name: Android startup tests
on:
  push:
    branches: [main, fix/automatic-android-startup]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy pillow opencv-python-headless requests flask loguru psutil apscheduler portalocker rapidfuzz scipy adbutils uiautomator2 pyminitouch PyGithub
      - name: Run offline suite
        run: python -m unittest discover -s tests -q
      - name: Compile sources
        run: python -m compileall -q src scripts tests
